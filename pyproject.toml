[tool.black]
line-length = 79
target-version = ["py310"]

[tool.isort]
profile = "black"
known_first_party = ["balance", "commands", "transaction", "main"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["^\\.venv/"]

[tool.coverage.run]
source = ["."]
omit = ["*test_*.py"]

[tool.coverage.report]
show_missing = true
